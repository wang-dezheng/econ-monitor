# ============================================================
#  每日经济观察 · 配置文件
#  改完保存即可，下次运行生效。所有中文注释都可以保留。
# ============================================================

app:
  title: "每日经济观察"
  timezone: "Asia/Shanghai"
  report_dir: "reports"
  data_dir: "data"
  log_dir: "logs"
  history_months: 36          # 看板展示最近多少个月

network:
  timeout: 18                 # 单次请求超时（秒）
  retries: 2
  # 需要科学上网时填本地代理，例如 "http://127.0.0.1:7890"
  # 留空表示直连。
  proxy: ""
  # overseas = 只让境外新闻走代理；all = 所有请求都走代理；none = 从不使用代理
  proxy_for: "overseas"
  # 境外源探测超时。没开 VPN 时会快速跳过，不拖慢整份报告。
  overseas_probe_timeout: 8

news:
  # 媒体新闻回看窗口（小时）
  window_hours: 48
  # 官方发布回看窗口（天）
  official_window_days: 7
  # 单次最多保留多少条新闻进入打分
  max_articles: 500
  # 报告里正文展示多少条
  max_report_items: 14

  domestic:
    - id: sina_finance
      name: "新浪财经"
      type: "sina_roll"
      url: "https://feed.mix.sina.com.cn/api/roll/get?pageid=153&lid=2516&num=60&page=1"
      weight: 1.0
      enabled: true

    - id: eastmoney_flash
      name: "东方财富快讯"
      type: "eastmoney_flash"
      url: "https://newsapi.eastmoney.com/kuaixun/v1/getlist_102_ajaxResult_60_1_.html"
      weight: 1.0
      enabled: true

    - id: wallstreetcn
      name: "华尔街见闻"
      type: "wscn_live"
      url: "https://api-one.wallstcn.com/apiv1/content/lives?channel=global-channel&client=pc&limit=60"
      weight: 1.1
      enabled: true

    - id: stats_gov
      name: "国家统计局"
      type: "official"
      url: "https://www.stats.gov.cn/sj/zxfb/"
      weight: 1.6
      max_age_days: 7
      enabled: true

    - id: pbc_gov
      name: "中国人民银行"
      type: "official"
      url: "http://www.pbc.gov.cn/goutongjiaoliu/113456/113469/index.html"
      weight: 1.6
      max_age_days: 7
      enabled: true

    - id: mof_gov
      name: "财政部"
      type: "official"
      url: "https://www.mof.gov.cn/zhengwuxinxi/caizhengxinwen/"
      weight: 1.5
      max_age_days: 7
      enabled: true

    - id: ndrc_gov
      name: "国家发改委"
      type: "official"
      url: "https://www.ndrc.gov.cn/xwdt/xwfb/"
      weight: 1.5
      max_age_days: 7
      enabled: true

  # 境外源：直连能通就自动启用；开了 VPN / 部署在境外时会自动生效。
  # enabled: auto 表示“能连上就用”，true 表示总是尝试，false 表示关闭。
  overseas:
    - id: ftchinese
      name: "FT中文网"
      type: "rss"
      url: "https://www.ftchinese.com/rss/news"
      weight: 1.3
      enabled: auto

    - id: bbc_zh
      name: "BBC中文"
      type: "rss"
      url: "https://feeds.bbci.co.uk/zhongwen/simp/rss.xml"
      weight: 1.1
      enabled: auto

    - id: nyt_zh
      name: "纽约时报中文网"
      type: "rss"
      url: "https://cn.nytimes.com/rss/"
      weight: 1.2
      enabled: auto

    - id: dw_zh
      name: "德国之声中文"
      type: "rss"
      url: "https://rss.dw.com/rdf/rss-chi-all-zh"
      weight: 1.0
      enabled: auto

    - id: zaobao
      name: "联合早报"
      type: "rss"
      url: "https://www.zaobao.com.sg/rss/realtime/china"
      weight: 1.0
      enabled: auto

    - id: nikkei_zh
      name: "日经中文网"
      type: "rss"
      url: "https://cn.nikkei.com/rss.html"
      weight: 1.1
      enabled: auto

    - id: cnbc_economy
      name: "CNBC Economy"
      type: "rss"
      url: "https://www.cnbc.com/id/20910258/device/rss/rss.html"
      weight: 1.2
      enabled: auto

    - id: marketwatch
      name: "MarketWatch"
      type: "rss"
      url: "https://feeds.marketwatch.com/marketwatch/topstories/"
      weight: 1.0
      enabled: auto

    - id: fed_press
      name: "美联储"
      type: "rss"
      url: "https://www.federalreserve.gov/feeds/press_all.xml"
      weight: 1.4
      enabled: auto

    - id: imf_blog
      name: "IMF Blog"
      type: "rss"
      url: "https://www.imf.org/en/Blogs/rss"
      weight: 1.2
      enabled: auto

    - id: google_news_china
      name: "Google News · China Economy"
      type: "rss"
      url: "https://news.google.com/rss/search?q=China+economy+when:3d&hl=en-US&gl=US&ceid=US:en"
      weight: 1.2
      enabled: auto

    - id: google_news_macro
      name: "Google News · Global Macro"
      type: "rss"
      url: "https://news.google.com/rss/search?q=Federal+Reserve+OR+inflation+OR+recession+when:3d&hl=en-US&gl=US&ceid=US:en"
      weight: 1.2
      enabled: auto

# 五个维度的权重。总和不必等于 1，程序会自动归一化。
pillars:
  growth:
    name: "增长动能"
    weight: 0.34
  prices:
    name: "物价水平"
    weight: 0.14
  money:
    name: "货币信用"
    weight: 0.20
  housing:
    name: "地产链"
    weight: 0.14
  external:
    name: "外部环境"
    weight: 0.18

scoring:
  z_window_months: 60        # 用最近 5 年做“正常区间”基准
  z_min_periods: 30
  z_scale: 16                # 每 1 个标准差对应多少分
  z_clip: 2.5
  # 数据超过这个天数算“滞后”，权重打折
  stale_days:
    M: 75
    Q: 150
    D: 15
  # 超过这个天数算“过期”，不进入当期总分
  drop_days:
    M: 120
    Q: 240
    D: 30

thresholds:
  temperature:
    cold: 40
    cool: 47.5
    warm: 52.5
    hot: 60
  news:
    negative: 45
    positive: 55

report:
  max_news: 14
  top_movers: 4
  open_after_run: false

# 可选的大模型解读。
# 优先读环境变量 ECON_LLM_API_KEY；也可以把 key 填在下面（不要提交到公开仓库）。
# enabled: auto = 有 key 就用，没有就用本地规则生成文字。
llm:
  enabled: auto
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"
  api_key_env: "ECON_LLM_API_KEY"
  api_key: ""
  timeout: 60
  max_tokens: 1200
